<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5">
  <title>Bncr API 文档</title>
  <style>
    :root {
      --bg: #f7f9fc;
      --surface: #ffffff;
      --border: #e6ebf1;
      --text: #32383e;
      --muted: #6e7781;
      --heading: #0d1117;
      --link: #0969da;
      --accent: #0969da;
      --accent2: #8250df;
      --code-bg: #f3fdf9;
      --code-border: #aedccf;
      --code-text: #0d1117;
      --inline: #cf222e;
      --sidebar-bg: #ffffff;
      --sidebar: 270px;
      --nav: 58px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; scroll-padding-top: calc(var(--nav) + 16px); overflow-x: hidden; }
    body {
      background: var(--bg);
      color: var(--text);
      font: 16px/1.8 -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Noto Sans SC', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* 背景：静态渐变，不做动画，避免 GPU 持续消耗 */
    #floating-bg {
      position: fixed; inset: 0; z-index: -1; pointer-events: none;
      background:
        radial-gradient(ellipse 65% 55% at 8% 8%, rgba(9,105,218,0.07) 0%, transparent 65%),
        radial-gradient(ellipse 55% 65% at 92% 92%, rgba(130,80,223,0.06) 0%, transparent 65%);
    }

    /* 导航栏：初始透明无阴影，滚动后平滑过渡 */
    #nav {
      position: fixed; top: 0; left: 0; right: 0; height: var(--nav);
      background: rgba(255,255,255,0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid transparent;
      display: flex; align-items: center; padding: 0 24px; z-index: 110; gap: 16px;
      transition: border-color 0.35s ease, box-shadow 0.35s ease, background 0.35s ease;
      transform: translateZ(0);
    }
    #nav.scrolled {
      background: rgba(255,255,255,0.96);
      border-bottom-color: var(--border);
      box-shadow: 0 2px 14px rgba(0,0,0,0.07);
    }
    #nav-logo {
      font-weight: 800; font-size: 17px; white-space: nowrap;
      background: linear-gradient(135deg, #0969da, #8250df);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    #nav-badge {
      background: linear-gradient(135deg, rgba(9,105,218,0.1), rgba(130,80,223,0.1));
      color: var(--link); font-size: 11px; font-weight: 700;
      padding: 3px 10px; border-radius: 20px; white-space: nowrap;
      border: 1px solid rgba(9,105,218,0.2);
    }
    #nav-sub { color: var(--muted); font-size: 14px; flex: 1; }
    #hamburger {
      display: none; flex-direction: column; gap: 5px; cursor: pointer;
      padding: 8px; border-radius: 8px; border: none; background: none; transition: background 0.2s;
    }
    #hamburger:hover { background: rgba(9,105,218,0.05); }
    #hamburger span { display: block; width: 20px; height: 2px; background: var(--text); border-radius: 2px; transition: transform 0.25s, opacity 0.25s; }
    #hamburger.open span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
    #hamburger.open span:nth-child(2) { opacity: 0; }
    #hamburger.open span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }

    #layout { display: flex; padding-top: var(--nav); }
    #overlay {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.3);
      z-index: 90; backdrop-filter: blur(2px);
    }
    #sidebar {
      width: var(--sidebar); position: fixed; top: var(--nav); left: 0; bottom: 0;
      overflow-y: auto; overflow-x: hidden; background: var(--sidebar-bg);
      border-right: 1px solid var(--border); padding: 24px 0 40px;
      transition: transform 0.28s cubic-bezier(0.4,0,0.2,1), box-shadow 0.28s;
      z-index: 100; transform: translateZ(0);
    }
    #sidebar::-webkit-scrollbar { width: 4px; }
    #sidebar::-webkit-scrollbar-thumb { background: #d3dae1; border-radius: 4px; }
    #toc-title { font-size: 11px; font-weight: 700; color: var(--muted); letter-spacing: 0.1em; text-transform: uppercase; padding: 0 20px 12px; }
    .toc-item {
      display: block; padding: 6px 20px; font-size: 14px; color: var(--muted);
      text-decoration: none; border-left: 3px solid transparent; line-height: 1.6;
      transition: color 0.15s, background 0.15s, border-color 0.15s;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .toc-item:hover { color: var(--text); background: rgba(9,105,218,0.04); }
    .toc-item.l2 { padding-left: 34px; font-size: 13.5px; }
    .toc-item.l3 { padding-left: 48px; font-size: 13px; color: #8c959f; }
    .toc-item.active {
      color: var(--link); border-left-color: var(--link);
      background: linear-gradient(90deg, rgba(9,105,218,0.08), rgba(9,105,218,0.02));
      font-weight: 600;
    }

    #main { margin-left: var(--sidebar); flex: 1; min-width: 0; padding: 40px 60px 80px; }
    #article { max-width: 900px; }
    #article h1, #article h2, #article h3, #article h4 { color: var(--heading); font-weight: 700; line-height: 1.4; margin: 2.2em 0 0.8em; }
    #article h1 {
      font-size: 2.2rem; border-bottom: 2px solid var(--border); padding-bottom: 0.6em; margin-top: 0.5em;
      background: linear-gradient(135deg, #0969da, #8250df);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    #article h2 { font-size: 1.6rem; border-bottom: 1px solid var(--border); padding-bottom: 0.5em; }
    #article h3 { font-size: 1.25rem; color: #0969da; }
    #article h4 { font-size: 1.05rem; }
    #article p { margin: 1em 0; color: #40464c; }
    #article a { color: var(--link); text-decoration: none; border-bottom: 1px solid rgba(9,105,218,0.25); transition: border-color 0.15s, background 0.15s; }
    #article a:hover { border-bottom-color: var(--link); background: rgba(9,105,218,0.03); }
    #article ul, #article ol { margin: 0.6em 0 0.6em 1.7em; color: #40464c; }
    #article li { margin: 0.4em 0; }
    #article strong { color: var(--heading); font-weight: 700; }
    #article em { color: #ac831e; }
    #article hr { border: none; border-top: 2px dashed var(--border); margin: 3em 0; }
    #article blockquote {
      border-left: 4px solid #0969da; padding: 0.9em 1.4em; margin: 1.2em 0;
      background: rgba(9,105,218,0.05); border-radius: 0 12px 12px 0;
    }
    #article blockquote p { margin: 0; color: #0969da; font-size: 15px; }

    /* 表格横向滚动容器 */
    .table-scroll {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      border-radius: 12px;
      border: 1px solid var(--border);
      box-shadow: 0 1px 4px rgba(0,0,0,0.04);
      margin: 1.2em 0;
    }
    #article table { width: 100%; border-collapse: collapse; font-size: 15px; min-width: max-content; }
    #article th {
      background: linear-gradient(135deg, #f1f6ff, #fdf5ff); color: var(--heading);
      font-weight: 700; padding: 13px 18px; text-align: left; border-bottom: 2px solid var(--border); white-space: nowrap;
    }
    #article td { padding: 12px 18px; border-bottom: 1px solid #eef1f4; vertical-align: top; color: #40464c; }
    #article tr:last-child td { border-bottom: none; }
    #article tbody tr:hover { background: rgba(9,105,218,0.04); }
    #article tbody tr:nth-child(even) { background: rgba(9,105,218,0.02); }

    #article pre {
      position: relative; background: var(--code-bg); border: 1px solid var(--code-border);
      border-radius: 12px; overflow: hidden; margin: 1.5em 0;
      box-shadow: 0 2px 8px rgba(174,220,207,0.15);
    }
    #article pre code {
      background: none !important; padding: 24px 26px; display: block; overflow-x: auto;
      font-size: 13.5px; line-height: 1.8; white-space: pre; color: var(--code-text);
      font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', monospace;
    }
    #article :not(pre) > code {
      background: rgba(175,184,193,0.2); color: var(--inline);
      padding: 3px 7px; border-radius: 7px; font-size: 13px;
      white-space: nowrap; font-weight: 600; font-family: 'JetBrains Mono', 'Fira Code', monospace;
    }
    .copy-btn {
      position: absolute; top: 12px; right: 12px; padding: 5px 14px;
      font-size: 11px; font-weight: 700; background: rgba(255,255,255,0.9);
      color: var(--muted); border: 1px solid var(--border); border-radius: 9px;
      cursor: pointer; opacity: 0; transition: opacity 0.2s, background 0.2s, color 0.2s, border-color 0.2s;
      box-shadow: 0 2px 6px rgba(0,0,0,0.08); backdrop-filter: blur(4px);
    }
    #article pre:hover .copy-btn { opacity: 1; }
    .copy-btn:hover { background: var(--link); color: #fff; border-color: var(--link); }
    .copy-btn.ok { background: #dafbe1; color: #1a7f37; border-color: #a8f0c6; }

    #loading {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      min-height: 60vh; color: var(--muted); font-size: 15px; gap: 16px;
    }
    .spinner {
      width: 36px; height: 36px; border: 3px solid var(--border);
      border-top-color: var(--link); border-radius: 50%; animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    #scroll-btn {
      position: fixed; bottom: 30px; right: 30px; width: 46px; height: 46px;
      border-radius: 50%; background: linear-gradient(135deg, #0969da, #8250df);
      border: none; color: #fff; font-size: 20px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: transform 0.2s, box-shadow 0.2s;
      z-index: 80; box-shadow: 0 4px 16px rgba(9,105,218,0.35);
    }
    #scroll-btn:hover { transform: translateY(-3px); box-shadow: 0 8px 24px rgba(9,105,218,0.45); }

    @media (max-width: 768px) {
      :root { --sidebar: 0px; }
      #hamburger { display: flex; }
      #sidebar { transform: translateX(-270px); width: 270px; box-shadow: 4px 0 30px rgba(0,0,0,0.15); }
      #sidebar.open { transform: none; }
      #overlay.show { display: block; }
      #main { margin-left: 0; padding: 24px 20px 60px; }
      #article h1 { font-size: 1.7rem; }
      #article h2 { font-size: 1.3rem; }
      #article pre code { padding: 16px 18px; font-size: 12.5px; }
      #article table { font-size: 13px; min-width: unset; }
      #nav-sub { display: none; }
      #scroll-btn { bottom: 20px; right: 16px; }
    }
    @media (max-width: 1150px) and (min-width: 769px) { #main { padding: 32px 36px 60px; } }
  </style>
</head>
<body>
  <div id="floating-bg"></div>
  <nav id="nav">
    <button id="hamburger" aria-label="菜单" onclick="toggleSidebar()">
      <span></span><span></span><span></span>
    </button>
    <div id="nav-logo">⚡ Bncr</div>
    <div id="nav-badge">API 文档</div>
    <div id="nav-sub">框架内置方法完整手册</div>
  </nav>
  <div id="overlay" onclick="closeSidebar()"></div>
  <div id="layout">
    <aside id="sidebar">
      <div id="toc-title">目录</div>
      <div id="toc-list"></div>
    </aside>
    <main id="main">
      <article id="article">
        <div id="loading"><div class="spinner"></div>文档加载中…</div>
      </article>
    </main>
  </div>
  <button id="scroll-btn" title="回到顶部">↑</button>

  <script src="https://cdn.jsdelivr.net/npm/marked@4/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/core.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/languages/javascript.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/languages/bash.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
  <script>
    const MD_URL = 'https://raw.githubusercontent.com/mourGod/Bncr/main/docs/Bncr%E6%A1%86%E6%9E%B6API.md';

    function toSlug(raw) {
      return String(raw)
        .replace(/[`*_]/g, '')
        .toLowerCase()
        .replace(/[^\w\s\u4e00-\u9fa5-]/g, '')
        .replace(/\s/g, '-')
        .replace(/^-+|-+$/g, '');
    }

    let jumpLockUntil = 0;

    function instantJumpTo(top, hash = '') {
      jumpLockUntil = Date.now() + 220;
      window.scrollTo(0, Math.max(0, Math.floor(top)));
      if (hash) history.replaceState(null, '', '#' + hash);
    }

    function buildTOCFromRendered() {
      const tocList = document.getElementById('toc-list');
      const headings = Array.from(document.querySelectorAll('#article h1, #article h2, #article h3'));

      tocList.innerHTML = headings.map(h => {
        const level = Number(h.tagName.slice(1));
        const cls = level === 1 ? '' : level === 2 ? 'l2' : 'l3';
        const text = (h.textContent || '').trim();
        const id = h.id;
        return `<a class="toc-item ${cls}" href="#${id}">${text}</a>`;
      }).join('');
    }

    function renderMD(md) {
      const renderer = new marked.Renderer();
      const idCount = {};
      renderer.heading = function(text, level, rawText) {
        const raw = (typeof rawText === 'string' ? rawText : null) || text;
        const id = toSlug(raw);
        idCount[id] = (idCount[id] || 0) + 1;
        const finalId = idCount[id] > 1 ? id + '-' + idCount[id] : id;
        return `<h${level} id="${finalId}">${text}</h${level}>`;
      };
      renderer.table = function(header, body) {
        return '<div class="table-scroll"><table><thead>' + header + '</thead><tbody>' + (body || '') + '</tbody></table></div>';
      };
      const html = marked.parse(md, { renderer });
      if (typeof DOMPurify !== 'undefined') {
        return DOMPurify.sanitize(html, {
          USE_PROFILES: { html: true },
          FORBID_TAGS: ['script', 'iframe', 'object', 'embed', 'form']
        });
      }
      return html;
    }

    function initCode() {
      if (typeof hljs === 'undefined') return setTimeout(initCode, 200);
      document.querySelectorAll('#article pre code').forEach(el => {
        hljs.highlightElement(el);
        const pre = el.parentElement;
        if (pre.querySelector('.copy-btn')) return;
        const btn = document.createElement('button');
        btn.className = 'copy-btn';
        btn.textContent = '复制';
        btn.onclick = () => {
          if (navigator.clipboard?.writeText) {
            navigator.clipboard.writeText(el.innerText).then(() => {
              btn.textContent = '✓'; btn.classList.add('ok');
              setTimeout(() => { btn.textContent = '复制'; btn.classList.remove('ok'); }, 1500);
            }).catch(() => {
              btn.textContent = '失败';
              setTimeout(() => { btn.textContent = '复制'; }, 1500);
            });
          } else {
            btn.textContent = '不支持';
            setTimeout(() => { btn.textContent = '复制'; }, 1500);
          }
        };
        pre.appendChild(btn);
      });
    }

    function initTOC() {
      const items = document.querySelectorAll('.toc-item');
      const map = {};
      items.forEach(a => {
        const id = decodeURIComponent(a.getAttribute('href').slice(1));
        map[id] = a;
        a.addEventListener('click', e => {
          const el = document.getElementById(id);
          if (el) {
            e.preventDefault();
            if (window.innerWidth <= 768) closeSidebar();
            const navHeight = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--nav'), 10) || 58;
            const targetTop = window.pageYOffset + el.getBoundingClientRect().top - navHeight - 8;
            instantJumpTo(targetTop, id);
          } else if (window.innerWidth <= 768) closeSidebar();
        });
      });

      // rAF 节流，避免 IntersectionObserver 频繁触发 DOM 操作
      let rafId = null;
      let activeId = '';
      const observer = new IntersectionObserver(entries => {
        entries.forEach(e => {
          if (!e.isIntersecting) return;
          if (Date.now() < jumpLockUntil) return;
          if (rafId) cancelAnimationFrame(rafId);
          rafId = requestAnimationFrame(() => {
            const nextId = e.target.id;
            if (!nextId || nextId === activeId) {
              rafId = null;
              return;
            }
            if (activeId && map[activeId]) map[activeId].classList.remove('active');
            const a = map[nextId];
            if (a) {
              a.classList.add('active');
              activeId = nextId;
            }
            rafId = null;
          });
        });
      }, { rootMargin: '-60px 0px -70% 0px' });
      document.querySelectorAll('#article h1, #article h2, #article h3').forEach(h => {
        if (h.id) observer.observe(h);
      });
    }

    function toggleSidebar() {
      document.getElementById('sidebar').classList.toggle('open');
      document.getElementById('overlay').classList.toggle('show');
      document.getElementById('hamburger').classList.toggle('open');
    }
    function closeSidebar() {
      document.getElementById('sidebar').classList.remove('open');
      document.getElementById('overlay').classList.remove('show');
      document.getElementById('hamburger').classList.remove('open');
    }

    // 导航栏滚动状态：rAF 节流
    const nav = document.getElementById('nav');
    let navRaf = null;
    window.addEventListener('scroll', () => {
      if (navRaf) return;
      navRaf = requestAnimationFrame(() => {
        nav.classList.toggle('scrolled', window.scrollY > 10);
        navRaf = null;
      });
    }, { passive: true });

    // 回到顶部 / 滚到底部按钮
    const scrollBtn = document.getElementById('scroll-btn');
    let scrollRaf = null;

    function updateScrollBtn() {
      const maxScroll = document.documentElement.scrollHeight - window.innerHeight;
      const atBottom = maxScroll > 0 && window.scrollY >= maxScroll - 80;
      scrollBtn.textContent = atBottom ? '↑' : '↓';
      scrollBtn.title = atBottom ? '回到顶部' : '滚动到底部';
    }

    scrollBtn.addEventListener('click', () => {
      const maxScroll = document.documentElement.scrollHeight - window.innerHeight;
      const atBottom = maxScroll > 0 && window.scrollY >= maxScroll - 80;
      instantJumpTo(atBottom ? 0 : document.body.scrollHeight);
    });

    window.addEventListener('scroll', () => {
      if (scrollRaf) return;
      scrollRaf = requestAnimationFrame(() => { updateScrollBtn(); scrollRaf = null; });
    }, { passive: true });
    updateScrollBtn();

    // 加载并渲染文档
    fetch(MD_URL, { cache: 'no-store' })
      .then(r => {
        if (!r.ok) throw new Error(`HTTP ${r.status}`);
        return r.text();
      })
      .then(md => {
        document.getElementById('article').innerHTML = renderMD(md);
        buildTOCFromRendered();
        initCode();
        initTOC();
      })
      .catch((err) => {
        const msg = err?.message ? String(err.message) : 'unknown';
        document.getElementById('article').innerHTML = `<p style="color:red;padding:2rem">文档加载失败（${msg}），请刷新重试。</p>`;
      });
  </script>
</body>
</html>
